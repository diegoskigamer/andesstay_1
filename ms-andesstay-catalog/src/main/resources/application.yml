server:
  port: 8082

spring:
  application:
    name: ms-andesstay-catalog

  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
